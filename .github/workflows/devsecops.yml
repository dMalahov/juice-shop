name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Сборка приложения
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Установить зависимости
        run: npm install --ignore-scripts
      - name: Проверка, что всё на месте
        run: echo "Базовый пайплайн работает"

  secrets-scan:
    name: Поиск секретов (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Запустить Gitleaks
        # Gitleaks по умолчанию возвращает ненулевой код при находке — это и есть гейт
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить Semgrep
        run: pip install semgrep

      # 1) Полный отчёт по всем severities — для артефакта и метрик
      - name: Semgrep - полный отчёт
        run: semgrep scan --config auto --sarif --output semgrep.sarif || true
      - name: Сохранить отчёт как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

      # 2) Гейт: падаем, если есть находки уровня ERROR (High)
      - name: Semgrep - quality gate (блокировка по High)
        run: semgrep scan --config auto --severity ERROR --error --quiet

  sca:
    name: SCA - зависимости (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy - скан зависимостей (гейт по CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-deps.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'          # <-- роняет сборку при CRITICAL/HIGH
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-deps-report
          path: trivy-deps.sarif

  image-scan:
    name: Сборка и скан образа (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать Docker-образ Juice Shop
        run: docker build -t juice-shop:test .
      - name: Trivy - скан образа (гейт по CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:test'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'          # <-- роняет сборку при CRITICAL/HIGH
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.sarif

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Запустить Juice Shop
        run: |
          docker run -d --name juiceshop -p 3000:3000 bkimminich/juice-shop
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && break; sleep 5; done
      - name: "ZAP Full Scan (гейт: без -I, падает при находках)"
        run: |
          mkdir -p "${{ github.workspace }}/zap-out"
          chmod 777 "${{ github.workspace }}/zap-out"
          docker run --rm --network=host \
            -v "${{ github.workspace }}/zap-out":/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:3000 \
            -m 3 \
            -J report_json.json -r report_html.html \
            -z "-config scanner.maxScanDurationInMins=15 -config scanner.maxRuleDurationInMins=2"
      - name: Сохранить отчёт ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/

  quality-gate:
    name: Quality Gate (итоговый контроль)
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, sca, image-scan, dast]
    steps:
      - name: Все проверки пройдены
        run: echo 'Quality gate passed - критических и высоких находок не обнаружено'
